<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Story of How We Recovered · A daily study of the Big Book</title>
<meta name="description" content="A self-paced daily study of the Big Book: one reading a day with questions to reflect on and a private journal.">
<meta name="theme-color" content="#0f1b30">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-master.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="How We Recovered">
<link rel="stylesheet" href="styles.css">
<script>
  (function(){try{var t=localStorage.getItem('bbd:theme');var f=localStorage.getItem('bbd:fs');
  if(t)document.documentElement.setAttribute('data-theme',t);
  if(f)document.documentElement.style.setProperty('--fs',f);}catch(e){}})();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to reading</a>
<header class="bar" id="bar" hidden>
  <button class="icon-btn" id="btnHome" aria-label="Cover">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 3.6 19.3 16.2H4.7Z"/></svg>
  </button>
  <nav class="tabs" aria-label="Main">
    <a href="#/today" data-tab="today">Today</a>
    <a href="#/contents" data-tab="contents">Contents</a>
    <a href="#/readings" data-tab="readings">Readings</a>
    <a href="#/journal" data-tab="journal">Journal</a>
  </nav>
  <button class="icon-btn" id="btnSettings" aria-label="Text size and display" aria-expanded="false" aria-controls="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18 9 6l5 12M5.8 14h6.4M15 18l3-7.5 3 7.5M16 16h4"/></svg>
  </button>
</header>
<div class="settings" id="settings" hidden>
  <div class="row"><span>Text size</span>
    <div class="seg"><button id="fsDown" aria-label="Smaller text">A−</button><output id="fsVal">100%</output><button id="fsUp" aria-label="Larger text">A+</button></div>
  </div>
  <div class="row"><span>Display</span>
    <div class="seg"><button id="thLight" data-th="light">Light</button><button id="thDark" data-th="dark">Dark</button></div>
  </div>
</div>
<main id="main" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
