name: decode-b64-assets
on:
  push:
    paths: ['**.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode .b64 files to binary
        run: |
          set -e
          for f in $(git ls-files '*.b64'); do base64 -d "$f" > "${f%.b64}"; git rm -q "$f"; git add "${f%.b64}"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Decode PNG icons" || echo "nothing to commit"
          git push
